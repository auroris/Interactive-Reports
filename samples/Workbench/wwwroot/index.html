<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InteractiveReport — Workbench</title>
    <style>
        /* Host-page chrome only — everything inside <interactive-report> ships with the package. */
        :root { color-scheme: light; }
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #eef1f4; color: #1f2733; }
        header {
            display: flex; align-items: center; gap: 1.25rem;
            background: #123a5e; color: #fff; padding: .65rem 1.25rem;
        }
        header h1 { font-size: 1rem; margin: 0; font-weight: 600; letter-spacing: .01em; }
        header .links { margin-left: auto; display: flex; gap: 1rem; align-items: center; font-size: .8rem; }
        header a { color: #bcd8f2; text-decoration: none; }
        header a:hover { color: #fff; text-decoration: underline; }
        #identity { background: rgba(255,255,255,.12); border-radius: 1em; padding: .15rem .7rem; font-size: .75rem; }
        main { max-width: 72rem; margin: 1.25rem auto; padding: 0 1rem; }
        .build-warning {
            max-width: 44rem; margin: 3rem auto; padding: 1rem 1.25rem;
            background: #fff8e1; border: 1px solid #e3c86d; border-radius: .4rem;
            color: #5b4611; line-height: 1.5;
        }
        .build-warning code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-weight: 600; }
    </style>
    <script type="module" src="/api/reports/ui/ir.js"></script>
</head>
<body>
    <header>
        <h1>InteractiveReport Workbench</h1>
        <div class="links">
            <span id="identity"></span>
            <a href="/admin.html">Saved-report admin</a>
        </div>
    </header>

    <main>
        <interactive-report report="orders" api-base="/api/reports">
            <p class="build-warning">
                You're seeing this message because you forgot to run
                <code>npm install &amp;&amp; npm run build</code>.
            </p>
        </interactive-report>
    </main>

    <script type="module">
        const who = await fetch("/api/reports/whoami").then(r => r.ok ? r.json() : null).catch(() => null);
        if (who) document.getElementById("identity").textContent =
            (who.identity ?? "anonymous") + (who.isAdministrator ? " · admin" : "");
    </script>
</body>
</html>
