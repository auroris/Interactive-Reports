<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InteractiveReport — Saved Report Admin</title>
    <link rel="stylesheet" href="/workbench-theme.css">
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #eef1f4; color: #1f2733; }
        header {
            display: flex; align-items: center; gap: 1.25rem;
            background: #123a5e; color: #fff; padding: .65rem 1.25rem;
        }
        header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
        header .links { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
        header a { color: #bcd8f2; text-decoration: none; font-size: .8rem; }
        header a:hover { color: #fff; text-decoration: underline; }
        main { max-width: 72rem; margin: 1.25rem auto; padding: 0 1rem; }
    </style>
    <script type="module" src="/workbench-theme.js"></script>
    <script type="module" src="/api/reports/ui/ir-admin.js"></script>
</head>
<body>
    <header>
        <h1>Saved Report Administration</h1>
        <div class="links">
            <div class="theme-toggle" role="radiogroup" aria-label="Theme">
                <input type="radio" id="theme-light" name="workbench-theme" value="light">
                <label for="theme-light" class="theme-btn" title="Light theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    Light
                </label>
                <input type="radio" id="theme-dark" name="workbench-theme" value="dark">
                <label for="theme-dark" class="theme-btn" title="Dark theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    Dark
                </label>
            </div>
            <a href="/">← Reports</a>
        </div>
    </header>
    <main>
        <interactive-report-admin></interactive-report-admin>
    </main>
</body>
</html>
